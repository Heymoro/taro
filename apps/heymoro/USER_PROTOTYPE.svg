<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc"><title id="title">Heymoro 用户模块与首页基座</title><desc id="desc">四屏：未登录首页、已登录首页、用户中心、编辑资料。</desc><style>text{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}.strong{font-weight:600}</style>
